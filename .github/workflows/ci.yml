name: CI

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # - run: uv run pytest  # enable once tests/ exists

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --no-dev
      # pygame-ce is LGPL-2.1; compatible with this GPL-3 project
      - run: >-
          uvx pip-licenses --python .venv/bin/python --partial-match
          --allow-only "MIT;BSD;Apache;ISC;PSF;Python Software Foundation;MPL;Unlicense"
          --ignore-packages pygame-ce
